plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wearlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.wearlauncher"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            storeFile file("wear.keystore")
            storePassword "wearlauncher"
            keyAlias "wear"
            keyPassword "wearlauncher"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Kotlin 1.8 merged the JDK 7/8 extension classes into kotlin-stdlib.
// Exclude the older split artifacts pulled transitively by dependencies;
// otherwise their classes conflict with kotlin-stdlib during APK packaging.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation('androidx.camera:camera-core:1.3.4') { exclude group: 'com.google.guava', module: 'guava' }
    implementation('androidx.camera:camera-camera2:1.3.4') { exclude group: 'com.google.guava', module: 'guava' }
    implementation('androidx.camera:camera-lifecycle:1.3.4') { exclude group: 'com.google.guava', module: 'guava' }
    implementation('androidx.camera:camera-view:1.3.4') { exclude group: 'com.google.guava', module: 'guava' }
    implementation('androidx.camera:camera-video:1.3.4') { exclude group: 'com.google.guava', module: 'guava' }

    implementation 'com.google.guava:guava:32.1.3-android'
}
